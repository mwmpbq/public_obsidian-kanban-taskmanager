name: Release plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          assets="main.js manifest.json styles.css"
          if [ -f LLM-GUIDE.md ]; then assets="$assets LLM-GUIDE.md"; fi
          gh release create "$TAG" \
            --title "$TAG" \
            --latest \
            --notes "For LLMs working with this plugin: LLM-GUIDE.md describes the data model, what changed in this version and how to migrate from earlier versions." \
            $assets
